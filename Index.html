<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión Tienda de Bicis</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">
  <div class="max-w-6xl mx-auto p-6">
    <header class="flex justify-between items-center mb-8 bg-white p-4 rounded-xl shadow-sm">
      <div class="flex items-center gap-3">
        <i data-lucide="bike" class="w-8 h-8 text-blue-600"></i>
        <h1 class="text-2xl font-bold">Gestión Tienda de Bicis</h1>
      </div>
      <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-3 py-1 rounded-full">Panel de Gerente</span>
    </header>

    <main class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
        <h2 class="text-lg font-semibold mb-2 text-gray-700">Estado del Servidor</h2>
        <p class="text-sm text-gray-500">Conectado a Supabase y desplegado en Vercel.</p>
      </div>
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
        <h2 class="text-lg font-semibold mb-2 text-gray-700">Tareas Pendientes</h2>
        <p class="text-3xl font-bold text-blue-600" id="task-count">0</p>
      </div>
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
        <h2 class="text-lg font-semibold mb-2 text-gray-700">Taller</h2>
        <p class="text-sm text-gray-500">Listo para registrar reparaciones y ventas.</p>
      </div>
    </main>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
