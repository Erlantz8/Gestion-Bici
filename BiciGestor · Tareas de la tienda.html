<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BiciGestor · Tareas de la tienda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  // Tema inicial antes de pintar
  (function () {
    var t = null;
    try { t = localStorage.getItem('bicigestor_theme'); } catch (e) {}
    if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    if (t === 'dark') document.documentElement.classList.add('dark');
  })();
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: { fontFamily: { sans: ['Manrope', 'ui-sans-serif', 'system-ui', 'Segoe UI', 'sans-serif'] } } }
  };
</script>
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  body { height: 100%; margin: 0; font-family: 'Manrope', ui-sans-serif, system-ui, 'Segoe UI', sans-serif; background: #f3f4f7; color: #14161c; }
  html.dark body { background: #0d0f14; color: #e8eaf0; }
  *:focus-visible { outline: 2px solid #4f6bff; outline-offset: 2px; }
  .scroll-y { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .task { transition: box-shadow .15s, transform .15s; }
  .task.dragging { opacity: .4; }
  .col-over { outline: 2px dashed #4f6bff; outline-offset: -4px; }
  @keyframes sheetIn { from { transform: translateY(24px); opacity: 0 } to { transform: none; opacity: 1 } }
  .sheet { animation: sheetIn .18s ease-out; }
  @media (prefers-reduced-motion: reduce) { .sheet { animation: none; } .task { transition: none; } }
  input[type=date]::-webkit-calendar-picker-indicator { cursor: pointer; }
  html.dark input[type=date] { color-scheme: dark; }
</style>
</head>
<body>
<div id="app" class="flex h-full">
  <div id="overlay" class="hidden fixed inset-0 z-30 bg-black/50 md:hidden" data-act="close-drawer"></div>
  <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-40 w-72 shrink-0 -translate-x-full md:translate-x-0 transition-transform bg-white dark:bg-[#12151c] border-r border-slate-200 dark:border-white/10 flex flex-col" style="padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)"></aside>

  <main class="flex-1 min-w-0 flex flex-col h-full">
    <header class="px-4 md:px-8 pt-4 pb-3 flex items-center gap-3">
      <button class="md:hidden p-2 -ml-2 rounded-lg hover:bg-slate-200/60 dark:hover:bg-white/10" data-act="open-drawer" aria-label="Abrir menú" id="btnMenu"></button>
      <h1 id="title" class="text-xl md:text-2xl font-extrabold tracking-tight truncate"></h1>
      <div class="ml-auto flex items-center gap-2">
        <div id="saveInd" class="flex items-center gap-1 text-xs font-semibold text-slate-500 transition-opacity opacity-0" aria-live="polite"></div>
        <div class="relative hidden sm:block">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" id="icoSearch"></span>
          <input id="search" type="search" placeholder="Buscar tarea o cliente" class="w-56 lg:w-72 pl-9 pr-3 py-2 rounded-xl text-sm bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 placeholder:text-slate-400">
        </div>
        <button class="p-2 rounded-xl bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10" data-act="theme" id="btnTheme" aria-label="Cambiar tema"></button>
      </div>
    </header>

    <div class="px-4 md:px-8 pb-3">
      <div class="relative">
        <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-indigo-500" id="icoQuick"></span>
        <input id="quick" type="text" autocomplete="off" enterkeyhint="done" placeholder="Anota una tarea y pulsa Enter  (empieza con ! para prioridad alta)" class="w-full pl-11 pr-4 py-3 rounded-2xl text-[15px] bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 shadow-sm placeholder:text-slate-400">
      </div>
      <input id="searchM" type="search" placeholder="Buscar tarea o cliente" class="sm:hidden mt-2 w-full px-3 py-2 rounded-xl text-sm bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 placeholder:text-slate-400">
    </div>

    <div class="flex-1 min-h-0 scroll-y px-4 md:px-8 pb-28">
      <section id="metrics" class="grid grid-cols-3 gap-2 md:gap-4"></section>
      <nav id="tabs" class="mt-5 flex items-center gap-1 p-1 rounded-xl bg-slate-200/60 dark:bg-white/5 w-full sm:w-fit"></nav>
      <section id="filters" class="mt-3 flex flex-wrap items-center gap-2"></section>
      <section id="content" class="mt-4"></section>
    </div>
  </main>
</div>

<button id="fab" data-act="new" class="fixed right-5 z-20 flex items-center gap-2 pl-4 pr-5 py-3.5 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold shadow-lg shadow-indigo-600/30" style="bottom:calc(1.25rem + env(safe-area-inset-bottom,0px))" aria-label="Nueva tarea"></button>

<div id="modal" class="hidden fixed inset-0 z-50"></div>
<div id="toast" class="fixed left-1/2 -translate-x-1/2 z-[60] hidden" style="bottom:calc(5.5rem + env(safe-area-inset-bottom,0px))"></div>
<input type="file" id="fileImport" accept="application/json" class="hidden">

<script>
/* ============ ICONOS (Lucide, inline) ============ */
const P = {
  plus:'<path d="M5 12h14M12 5v14"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',
  moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
  menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  trash:'<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  calendar:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  kanban:'<path d="M6 5v11M12 5v14M18 5v6"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
  user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  message:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  pencil:'<path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
  arrow:'<path d="M5 12h14M12 5l7 7-7 7"/>',
  alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4M12 17h.01"/>',
  home:'<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  bike:'<circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M15 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm-3 11.5V14l-3-3 4-3 2 3h2"/>',
  chevron:'<path d="m9 18 6-6-6-6"/>',
  zap:'<path d="M13 2 3 14h9l-1 8 10-12h-9z"/>'
};
const icon = (n, c = 'w-4 h-4') => `<svg class="${c} shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

/* ============ UTILIDADES ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const ymd = d => { const z = new Date(d); return z.getFullYear() + '-' + pad(z.getMonth() + 1) + '-' + pad(z.getDate()); };
const todayStr = () => ymd(new Date());
const addDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d); };
const diffDays = s => Math.round((new Date(s + 'T00:00:00') - new Date(todayStr() + 'T00:00:00')) / 864e5);
const fmtDate = s => new Date(s + 'T00:00:00').toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' });
const fmtStamp = iso => new Date(iso).toLocaleString('es-ES', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });

/* ============ ESTADO + PERSISTENCIA ============ */
const KEY = 'bicigestor_v1';
const PALETTE = ['#4f6bff', '#e5484d', '#f59e0b', '#10b981', '#06b6d4', '#a855f7', '#ec4899', '#64748b'];
const PR = {
  high: { label: 'Alta', full: 'Alta / Importante', badge: 'bg-red-100 text-red-700 dark:bg-red-500/20 dark:text-red-300', border: 'border-l-red-500', on: 'peer-checked:bg-red-500 peer-checked:text-white', rank: 0 },
  med:  { label: 'Media', full: 'Media', badge: 'bg-amber-100 text-amber-800 dark:bg-amber-500/20 dark:text-amber-300', border: 'border-l-amber-400', on: 'peer-checked:bg-amber-400 peer-checked:text-black', rank: 1 },
  low:  { label: 'Leve', full: 'Leve / Baja', badge: 'bg-emerald-100 text-emerald-700 dark:bg-emerald-500/20 dark:text-emerald-300', border: 'border-l-emerald-500', on: 'peer-checked:bg-emerald-500 peer-checked:text-white', rank: 2 }
};
const ST = { todo: 'Pendiente', doing: 'En proceso', done: 'Completada' };

function defaultCats() {
  const mk = (name, color, subs) => ({ id: uid(), name, color, subs: subs.map(n => ({ id: uid(), name: n })) });
  return [
    mk('Ventas', PALETTE[0], ['Pedidos', 'Stock', 'Precios y Compras']),
    mk('Taller', PALETTE[2], ['Reparaciones']),
    mk('Marketing', PALETTE[6], ['Redes Sociales', 'Campañas', 'Colecciones']),
    mk('Comunidad', PALETTE[3], ['Eventos', 'Gestión de comunidad']),
    mk('Administración', PALETTE[7], ['Facturas', 'Proveedores', 'Asesoría'])
  ];
}
function seedTasks(cats) {
  const c = n => cats.find(x => x.name === n), s = (cat, n) => cat.subs.find(x => x.name === n).id;
  const now = new Date().toISOString();
  const t = (title, cat, sub, priority, due, client, status) => ({ id: uid(), title, catId: cat.id, subId: s(cat, sub), priority, due, client, status, notes: [], createdAt: now, completedAt: status === 'done' ? now : null });
  return [
    t('Revisar frenos de la bici de montaña', c('Taller'), 'Reparaciones', 'high', todayStr(), 'Marta López', 'doing'),
    t('Pedir cubiertas de gravel a proveedor', c('Ventas'), 'Precios y Compras', 'med', addDays(2), '', 'todo'),
    t('Publicar fotos de la nueva colección', c('Marketing'), 'Colecciones', 'low', addDays(5), '', 'todo'),
    t('Enviar facturas del mes a la asesoría', c('Administración'), 'Asesoría', 'high', addDays(-1), '', 'todo')
  ];
}
let state;
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) { const s = JSON.parse(raw); if (s && s.cats && s.tasks) return s; } } catch (e) {}
  const cats = defaultCats();
  return { cats, tasks: seedTasks(cats) };
}
const IDB = {
  open() { return new Promise((res, rej) => { const r = indexedDB.open('bicigestor', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async set(k, v) { const db = await this.open(); return new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => { db.close(); res(); }; tx.onerror = () => rej(tx.error); }); },
  async get(k) { const db = await this.open(); return new Promise((res, rej) => { const rq = db.transaction('kv').objectStore('kv').get(k); rq.onsuccess = () => { db.close(); res(rq.result); }; rq.onerror = () => rej(rq.error); }); }
};
let indT;
function indicator(ok) {
  const el = $('#saveInd'); if (!el) return;
  el.innerHTML = ok ? `<span class="text-emerald-600 dark:text-emerald-400">${icon('check', 'w-3.5 h-3.5')}</span><span class="hidden sm:inline">Guardado</span>` : `<span class="text-red-600">${icon('alert', 'w-3.5 h-3.5')}</span><span class="text-red-600">No se pudo guardar</span>`;
  el.classList.remove('opacity-0');
  clearTimeout(indT);
  if (ok) indT = setTimeout(() => el.classList.add('opacity-0'), 1800);
}
function save() {
  const json = JSON.stringify(state);
  let lsOk = false;
  try { localStorage.setItem(KEY, json); lsOk = true; } catch (e) {}
  IDB.set(KEY, json).then(() => indicator(true)).catch(() => indicator(lsOk));
  if (lsOk) indicator(true);
}
const hadLS = (() => { try { return !!localStorage.getItem(KEY); } catch (e) { return false; } })();
state = load();

const ui = { view: 'kanban', range: 'hoy', cat: null, sub: null, q: '', prio: '', due: '', status: '' };
let modal = null; // { type:'task', draft, isNew } | { type:'cats' }

/* ============ HELPERS DE DATOS ============ */
const catOf = id => state.cats.find(c => c.id === id);
const subOf = (t) => { const c = catOf(t.catId); return c ? c.subs.find(s => s.id === t.subId) : null; };
function dueInfo(t) {
  if (!t.due) return null;
  if (t.status === 'done') return { label: fmtDate(t.due), cls: 'bg-slate-100 text-slate-500 dark:bg-white/10 dark:text-slate-400', ico: 'calendar' };
  const d = diffDays(t.due);
  if (d < 0) return { label: d === -1 ? 'Venció ayer' : `Vencida hace ${-d} días`, cls: 'bg-red-600 text-white', ico: 'alert' };
  if (d === 0) return { label: 'Hoy', cls: 'bg-orange-500 text-white', ico: 'clock' };
  if (d === 1) return { label: 'Mañana', cls: 'bg-amber-200 text-amber-900 dark:bg-amber-500/25 dark:text-amber-200', ico: 'clock' };
  if (d <= 3) return { label: `En ${d} días`, cls: 'bg-amber-100 text-amber-800 dark:bg-amber-500/15 dark:text-amber-300', ico: 'clock' };
  return { label: fmtDate(t.due), cls: 'bg-slate-100 text-slate-600 dark:bg-white/10 dark:text-slate-300', ico: 'calendar' };
}
function sortTasks(arr) {
  return arr.slice().sort((a, b) => {
    if (a.status === 'done' && b.status === 'done') return (b.completedAt || '').localeCompare(a.completedAt || '');
    const da = a.due || '9999-12-31', db = b.due || '9999-12-31';
    if (da !== db) return da.localeCompare(db);
    return PR[a.priority].rank - PR[b.priority].rank;
  });
}
function matches(t, skipStatus) {
  if (ui.cat && t.catId !== ui.cat) return false;
  if (ui.sub && t.subId !== ui.sub) return false;
  if (ui.prio && t.priority !== ui.prio) return false;
  if (ui.q) {
    const q = ui.q.toLowerCase();
    if (!(t.title.toLowerCase().includes(q) || (t.client || '').toLowerCase().includes(q) || t.notes.some(n => n.text.toLowerCase().includes(q)))) return false;
  }
  if (ui.due) {
    const d = t.due ? diffDays(t.due) : null;
    if (ui.due === 'overdue' && !(d !== null && d < 0 && t.status !== 'done')) return false;
    if (ui.due === 'urgent' && !(d !== null && d <= 0 && t.status !== 'done')) return false;
    if (ui.due === 'today' && d !== 0) return false;
    if (ui.due === 'week' && !(d !== null && d >= 0 && d <= 7)) return false;
    if (ui.due === 'nodate' && t.due) return false;
  }
  if (!skipStatus) {
    if (ui.status === 'open' && t.status === 'done') return false;
    if (ui.status === 'done' && t.status !== 'done') return false;
  }
  return true;
}
const filtered = skipStatus => state.tasks.filter(t => matches(t, skipStatus));
const hasFilters = () => ui.prio || ui.due || ui.status || ui.q;

/* ============ SNAPSHOT / DESHACER ============ */
function toast(msg, undoSnap) {
  const el = $('#toast');
  el.innerHTML = `<div class="flex items-center gap-3 pl-4 pr-2 py-2.5 rounded-xl bg-slate-900 text-white dark:bg-white dark:text-slate-900 shadow-xl text-sm font-semibold">
    <span>${esc(msg)}</span>${undoSnap ? `<button data-act="undo" class="px-3 py-1 rounded-lg bg-white/15 dark:bg-slate-900/10 hover:bg-white/25">Deshacer</button>` : ''}</div>`;
  el.classList.remove('hidden');
  el._snap = undoSnap || null;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.add('hidden'), undoSnap ? 6000 : 2200);
}
const snapshot = () => JSON.stringify(state);

/* ============ RENDER: SIDEBAR ============ */
function renderSidebar() {
  const open = t => t.status !== 'done';
  const navBtn = (active, inner, act, extra = '') => `<button ${extra} data-act="${act}" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-sm font-semibold text-left ${active ? 'bg-indigo-600 text-white' : 'hover:bg-slate-100 dark:hover:bg-white/5 text-slate-700 dark:text-slate-200'}">${inner}</button>`;
  let h = `<div class="px-5 pt-5 pb-4 flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center">${icon('bike', 'w-5 h-5')}</div>
      <div><div class="font-extrabold leading-tight">BiciGestor</div><div class="text-xs text-slate-500">Panel del gerente</div></div>
      <button class="md:hidden ml-auto p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-white/10" data-act="close-drawer" aria-label="Cerrar">${icon('x', 'w-5 h-5')}</button>
    </div><div class="flex-1 scroll-y px-3 space-y-1">`;
  h += navBtn(!ui.cat, `${icon('home', 'w-4 h-4')}<span class="flex-1">Todas las áreas</span><span class="text-xs opacity-70">${state.tasks.filter(open).length}</span>`, 'cat', 'data-id=""');
  state.cats.forEach(c => {
    const active = ui.cat === c.id;
    const n = state.tasks.filter(t => t.catId === c.id && open(t)).length;
    h += navBtn(active && !ui.sub, `<span class="w-2.5 h-2.5 rounded-full" style="background:${c.color}"></span><span class="flex-1 truncate">${esc(c.name)}</span><span class="text-xs opacity-70">${n}</span>`, 'cat', `data-id="${c.id}"`);
    if (active) {
      c.subs.forEach(s => {
        const sn = state.tasks.filter(t => t.subId === s.id && open(t)).length;
        const sa = ui.sub === s.id;
        h += `<button data-act="sub" data-id="${s.id}" class="w-full flex items-center gap-2 pl-9 pr-3 py-1.5 rounded-lg text-[13px] font-medium text-left ${sa ? 'bg-indigo-100 text-indigo-700 dark:bg-indigo-500/20 dark:text-indigo-200' : 'text-slate-500 hover:bg-slate-100 dark:hover:bg-white/5 dark:text-slate-400'}"><span class="flex-1 truncate">${esc(s.name)}</span><span class="text-xs opacity-70">${sn}</span></button>`;
      });
    }
  });
  const orphan = state.tasks.filter(t => !catOf(t.catId) && open(t)).length;
  if (orphan) h += navBtn(ui.cat === '__none', `<span class="w-2.5 h-2.5 rounded-full bg-slate-400"></span><span class="flex-1">Sin categoría</span><span class="text-xs opacity-70">${orphan}</span>`, 'cat', 'data-id="__none"');
  h += `</div><div class="p-3 border-t border-slate-200 dark:border-white/10 space-y-1">
      <button data-act="cats" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-sm font-semibold hover:bg-slate-100 dark:hover:bg-white/5">${icon('pencil')}Gestionar categorías</button>
      <div class="flex gap-1">
        <button data-act="export" class="flex-1 flex items-center justify-center gap-2 px-2 py-2 rounded-xl text-xs font-semibold hover:bg-slate-100 dark:hover:bg-white/5 text-slate-500">${icon('download')}Copia de seguridad</button>
        <button data-act="import" class="flex-1 flex items-center justify-center gap-2 px-2 py-2 rounded-xl text-xs font-semibold hover:bg-slate-100 dark:hover:bg-white/5 text-slate-500">${icon('upload')}Restaurar</button>
      </div></div>`;
  $('#sidebar').innerHTML = h;
}

/* ============ RENDER: CABECERA, MÉTRICAS, PESTAÑAS, FILTROS ============ */
function renderCtrl() {
  // Título
  let title = 'Todas las áreas';
  const c = catOf(ui.cat);
  if (ui.cat === '__none') title = 'Sin categoría';
  else if (c) { title = c.name; if (ui.sub) { const s = c.subs.find(x => x.id === ui.sub); if (s) title += ' · ' + s.name; } }
  $('#title').textContent = title;

  // Métricas (globales)
  const urgent = state.tasks.filter(t => t.status !== 'done' && t.due && diffDays(t.due) <= 0);
  const overdue = urgent.filter(t => diffDays(t.due) < 0).length;
  const pend = state.tasks.filter(t => t.status !== 'done').length;
  const done = state.tasks.filter(t => t.status === 'done').length;
  const card = (act, ico, label, n, sub, tone) => `<button data-act="${act}" class="text-left p-3 md:p-4 rounded-2xl border ${tone} transition hover:shadow-md">
      <div class="flex items-center gap-1.5 text-[11px] md:text-xs font-semibold opacity-80">${icon(ico)}<span class="truncate">${label}</span></div>
      <div class="mt-1 text-2xl md:text-4xl font-extrabold tabular-nums">${n}</div>
      <div class="text-[11px] md:text-xs opacity-70 truncate">${sub}</div></button>`;
  $('#metrics').innerHTML =
    card('m-urgent', 'zap', 'Urgentes hoy', urgent.length, overdue ? `${overdue} vencida${overdue > 1 ? 's' : ''}` : 'Al día', urgent.length ? 'bg-red-50 border-red-200 text-red-900 dark:bg-red-500/10 dark:border-red-500/30 dark:text-red-200' : 'bg-white border-slate-200 dark:bg-white/5 dark:border-white/10') +
    card('m-open', 'list', 'Pendientes', pend, 'Todas las áreas', 'bg-white border-slate-200 dark:bg-white/5 dark:border-white/10') +
    card('m-done', 'check', 'Completadas', done, 'Histórico', 'bg-emerald-50 border-emerald-200 text-emerald-900 dark:bg-emerald-500/10 dark:border-emerald-500/30 dark:text-emerald-200');

  // Pestañas
  const tab = (v, ico, label) => `<button data-act="view" data-id="${v}" class="flex-1 sm:flex-none flex items-center justify-center gap-2 px-4 py-2 rounded-lg text-sm font-bold ${ui.view === v ? 'bg-white dark:bg-white/15 shadow-sm' : 'text-slate-500 hover:text-slate-800 dark:hover:text-white'}">${icon(ico)}${label}</button>`;
  $('#tabs').innerHTML = tab('kanban', 'kanban', 'Tablero') + tab('hoy', 'target', 'Hoy / Semana') + tab('lista', 'list', 'Lista');

  // Filtros
  const sel = (id, val, opts) => `<select id="${id}" class="px-3 py-2 rounded-xl text-sm font-semibold bg-white dark:bg-[#161a23] border border-slate-200 dark:border-white/10">${opts.map(o => `<option value="${o[0]}" ${o[0] === val ? 'selected' : ''}>${o[1]}</option>`).join('')}</select>`;
  let f = sel('fltPrio', ui.prio, [['', 'Toda prioridad'], ['high', 'Alta / Importante'], ['med', 'Media'], ['low', 'Leve / Baja']]);
  if (ui.view !== 'hoy') f += sel('fltDue', ui.due, [['', 'Cualquier fecha'], ['urgent', 'Urgentes (vencidas + hoy)'], ['overdue', 'Vencidas'], ['today', 'Hoy'], ['week', 'Próximos 7 días'], ['nodate', 'Sin fecha']]);
  if (ui.view === 'lista') f += sel('fltStatus', ui.status, [['', 'Todos los estados'], ['open', 'Sin completar'], ['done', 'Completadas']]);
  if (hasFilters()) f += `<button data-act="clear" class="px-3 py-2 rounded-xl text-sm font-semibold text-indigo-600 dark:text-indigo-300 hover:bg-indigo-50 dark:hover:bg-indigo-500/10">Limpiar filtros</button>`;

}

/* ============ RENDER: TARJETA ============ */
function card(t) {
  const c = catOf(t.catId), s = subOf(t), di = dueInfo(t), pr = PR[t.priority], done = t.status === 'done';
  return `<div class="task bg-white dark:bg-[#161a23] border border-slate-200 dark:border-white/10 border-l-4 ${pr.border} rounded-xl p-3 shadow-sm hover:shadow-md cursor-pointer ${done ? 'opacity-70' : ''}" draggable="true" data-act="open" data-id="${t.id}">
    <div class="flex items-start gap-3">
      <button data-act="toggle" data-id="${t.id}" aria-label="${done ? 'Reabrir' : 'Completar'}" class="mt-0.5 w-6 h-6 rounded-full border-2 flex items-center justify-center ${done ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 dark:border-slate-600 hover:border-emerald-500 text-transparent hover:text-emerald-500'}">${icon('check', 'w-3.5 h-3.5')}</button>
      <div class="min-w-0 flex-1">
        <p class="text-[15px] font-semibold leading-snug ${done ? 'line-through' : ''}">${esc(t.title)}</p>
        <div class="mt-2 flex flex-wrap items-center gap-1.5 text-xs font-semibold">
          ${c ? `<span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-md bg-slate-100 dark:bg-white/10 text-slate-600 dark:text-slate-300"><span class="w-2 h-2 rounded-full" style="background:${c.color}"></span>${esc(c.name)}${s ? ' › ' + esc(s.name) : ''}</span>` : ''}
          <span class="px-2 py-0.5 rounded-md ${pr.badge}">${pr.label}</span>
          ${di ? `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md ${di.cls}">${icon(di.ico, 'w-3 h-3')}${esc(di.label)}</span>` : ''}
          ${t.client ? `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-sky-100 text-sky-800 dark:bg-sky-500/15 dark:text-sky-300">${icon('user', 'w-3 h-3')}${esc(t.client)}</span>` : ''}
          ${t.notes.length ? `<span class="inline-flex items-center gap-1 text-slate-500">${icon('message', 'w-3 h-3')}${t.notes.length}</span>` : ''}
          ${t.status === 'doing' && ui.view !== 'kanban' ? `<span class="px-2 py-0.5 rounded-md bg-indigo-100 text-indigo-700 dark:bg-indigo-500/20 dark:text-indigo-300">En proceso</span>` : ''}
        </div>
      </div>
      ${!done ? `<button data-act="advance" data-id="${t.id}" title="${t.status === 'todo' ? 'Pasar a En proceso' : 'Completar'}" class="p-1.5 rounded-lg text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 dark:hover:bg-indigo-500/10">${icon('arrow')}</button>` : ''}
    </div></div>`;
}

const empty = (msg, sub) => `<div class="py-14 text-center text-slate-500"><div class="mx-auto w-12 h-12 rounded-2xl bg-slate-200/70 dark:bg-white/5 flex items-center justify-center mb-3">${icon('check', 'w-6 h-6')}</div><p class="font-bold text-slate-700 dark:text-slate-200">${msg}</p><p class="text-sm mt-1">${sub || ''}</p></div>`;

/* ============ RENDER: CONTENIDO ============ */
function renderContent() {
  const el = $('#content');
  if (ui.view === 'kanban') {
    const list = filtered(true);
    el.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-3 gap-4">` + ['todo', 'doing', 'done'].map(st => {
      let items = sortTasks(list.filter(t => t.status === st));
      const total = items.length;
      if (st === 'done') items = items.slice(0, 15);
      const dot = { todo: 'bg-slate-400', doing: 'bg-indigo-500', done: 'bg-emerald-500' }[st];
      return `<div class="rounded-2xl bg-slate-200/50 dark:bg-white/[.04] p-2.5 min-h-[120px]" data-col="${st}">
        <div class="flex items-center gap-2 px-1.5 py-1.5 mb-1.5">
          <span class="w-2.5 h-2.5 rounded-full ${dot}"></span><h3 class="font-extrabold text-sm">${ST[st]}</h3>
          <span class="text-xs font-bold text-slate-500">${total}</span>
          ${st !== 'done' ? `<button data-act="new" data-st="${st}" class="ml-auto p-1 rounded-lg text-slate-500 hover:bg-white dark:hover:bg-white/10" aria-label="Añadir en ${ST[st]}">${icon('plus')}</button>` : ''}
        </div>
        <div class="space-y-2">${items.map(card).join('') || `<p class="text-center text-xs text-slate-400 py-6">Suelta tareas aquí</p>`}${st === 'done' && total > 15 ? `<p class="text-center text-xs text-slate-400 pt-1">Últimas 15 de ${total}. Ver todas en Lista.</p>` : ''}</div></div>`;
    }).join('') + `</div>`;
    return;
  }
  if (ui.view === 'lista') {
    const items = sortTasks(filtered(false));
    el.innerHTML = items.length ? `<div class="space-y-2 max-w-3xl">${items.map(card).join('')}</div>` : empty('Nada que mostrar', hasFilters() ? 'Prueba a limpiar los filtros.' : 'Anota tu primera tarea arriba.');
    return;
  }
  // Hoy / Semana
  const open = filtered(true).filter(t => t.status !== 'done');
  const withD = open.filter(t => t.due);
  const groups = [
    { k: 'Vencidas', cls: 'text-red-600 dark:text-red-400', items: withD.filter(t => diffDays(t.due) < 0) },
    { k: 'Hoy', cls: 'text-orange-600 dark:text-orange-400', items: withD.filter(t => diffDays(t.due) === 0) }
  ];
  if (ui.range === 'semana') {
    for (let i = 1; i <= 7; i++) {
      const d = addDays(i);
      groups.push({ k: i === 1 ? 'Mañana' : fmtDate(d).replace(/^./, m => m.toUpperCase()), cls: 'text-slate-700 dark:text-slate-200', items: withD.filter(t => t.due === d) });
    }
  }
  const seg = `<div class="mb-4 inline-flex p-1 rounded-xl bg-slate-200/60 dark:bg-white/5">${['hoy', 'semana'].map(r => `<button data-act="range" data-id="${r}" class="px-4 py-1.5 rounded-lg text-sm font-bold ${ui.range === r ? 'bg-white dark:bg-white/15 shadow-sm' : 'text-slate-500'}">${r === 'hoy' ? 'Hoy' : 'Esta semana'}</button>`).join('')}</div>`;
  const shown = groups.filter(g => g.items.length);
  let body = shown.map(g => `<div class="mb-5"><h3 class="font-extrabold text-sm mb-2 ${g.cls}">${g.k} <span class="text-slate-400 font-bold">${g.items.length}</span></h3><div class="space-y-2">${sortTasks(g.items).map(card).join('')}</div></div>`).join('');
  const hi = open.filter(t => !t.due && t.priority === 'high');
  if (hi.length) body += `<div class="mb-5"><h3 class="font-extrabold text-sm mb-2 text-red-600 dark:text-red-400">Importantes sin fecha <span class="text-slate-400 font-bold">${hi.length}</span></h3><div class="space-y-2">${hi.map(card).join('')}</div></div>`;
  el.innerHTML = `<div class="max-w-3xl">${seg}${body || empty(ui.range === 'hoy' ? 'Hoy no tienes nada pendiente' : 'Semana despejada', 'Usa la barra superior para anotar algo nuevo.')}</div>`;
}

function render() { renderSidebar(); renderCtrl(); renderContent(); save(); }
function renderMain() { renderCtrl(); renderContent(); renderSidebar(); save(); }

/* ============ MODAL TAREA ============ */
function openTask(id, preset) {
  const base = id ? state.tasks.find(t => t.id === id) : null;
  if (id && !base) return;
  const firstCat = ui.cat && catOf(ui.cat) ? catOf(ui.cat) : null;
  const draft = base ? JSON.parse(JSON.stringify(base)) : {
    id: uid(), title: '', catId: firstCat ? firstCat.id : (state.cats[0] ? state.cats[0].id : null), subId: ui.sub || null,
    priority: 'med', due: ui.view === 'hoy' ? todayStr() : '', client: '', status: (preset && preset.status) || 'todo', notes: [], createdAt: new Date().toISOString(), completedAt: null
  };
  if (!base && draft.catId) { const c = catOf(draft.catId); if (c && !c.subs.find(s => s.id === draft.subId)) draft.subId = null; }
  modal = { type: 'task', draft, isNew: !base };
  drawTaskModal();
}
function subOptions(catId, subId) {
  const c = catOf(catId);
  return `<option value="">Sin subcategoría</option>` + (c ? c.subs.map(s => `<option value="${s.id}" ${s.id === subId ? 'selected' : ''}>${esc(s.name)}</option>`).join('') : '');
}
function notesHTML(d) {
  if (!d.notes.length) return `<p class="text-sm text-slate-400 py-2">Sin notas todavía.</p>`;
  return d.notes.slice().reverse().map(n => `<div class="p-3 rounded-xl bg-slate-100 dark:bg-white/5"><p class="text-sm whitespace-pre-wrap break-words">${esc(n.text)}</p><p class="mt-1.5 text-[11px] font-semibold text-slate-500 flex items-center gap-1">${icon('clock', 'w-3 h-3')}${fmtStamp(n.ts)}</p></div>`).join('');
}
function drawTaskModal() {
  const d = modal.draft;
  const lbl = 'block text-xs font-bold text-slate-500 dark:text-slate-400 mb-1.5';
  const inp = 'w-full px-3 py-2.5 rounded-xl text-[15px] bg-white dark:bg-[#0d0f14] border border-slate-300 dark:border-white/15';
  const seg = (name, items, cur) => `<div class="grid grid-cols-${items.length} gap-1.5">${items.map(([v, l, on]) => `<label class="cursor-pointer"><input type="radio" name="${name}" value="${v}" class="peer sr-only" ${v === cur ? 'checked' : ''}><span class="block text-center py-2.5 rounded-xl text-sm font-bold bg-slate-100 dark:bg-white/10 text-slate-600 dark:text-slate-300 ${on} peer-focus-visible:outline peer-focus-visible:outline-2 peer-focus-visible:outline-indigo-500">${l}</span></label>`).join('')}</div>`;
  $('#modal').innerHTML = `<div class="absolute inset-0 bg-black/60" data-act="close-modal"></div>
  <div class="sheet absolute inset-x-0 bottom-0 md:inset-0 md:m-auto md:max-w-xl md:h-fit md:max-h-[92vh] max-h-[94vh] flex flex-col bg-white dark:bg-[#12151c] rounded-t-3xl md:rounded-3xl shadow-2xl">
    <div class="flex items-center gap-2 px-5 pt-4 pb-3 border-b border-slate-200 dark:border-white/10">
      <h2 class="font-extrabold text-lg">${modal.isNew ? 'Nueva tarea' : 'Editar tarea'}</h2>${modal.isNew ? '' : `<span class="text-xs font-semibold text-emerald-600 dark:text-emerald-400">Se guarda solo</span>`}
      <button class="ml-auto p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-white/10" data-act="close-modal" aria-label="Cerrar">${icon('x', 'w-5 h-5')}</button>
    </div>
    <div class="scroll-y px-5 py-4 space-y-4">
      <div><label class="${lbl}" for="fTitle">Título</label><input id="fTitle" class="${inp} font-semibold" value="${esc(d.title)}" placeholder="¿Qué hay que hacer?" autocomplete="off"></div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="${lbl}" for="fCat">Categoría</label><select id="fCat" class="${inp}"><option value="">Sin categoría</option>${state.cats.map(c => `<option value="${c.id}" ${c.id === d.catId ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></div>
        <div><label class="${lbl}" for="fSub">Subcategoría</label><select id="fSub" class="${inp}">${subOptions(d.catId, d.subId)}</select></div>
      </div>
      <div><span class="${lbl}">Prioridad</span>${seg('prio', [['high', 'Alta', PR.high.on], ['med', 'Media', PR.med.on], ['low', 'Leve', PR.low.on]], d.priority)}</div>
      <div><span class="${lbl}">Estado</span>${seg('status', [['todo', 'Pendiente', 'peer-checked:bg-slate-500 peer-checked:text-white'], ['doing', 'En proceso', 'peer-checked:bg-indigo-600 peer-checked:text-white'], ['done', 'Completada', 'peer-checked:bg-emerald-500 peer-checked:text-white']], d.status)}</div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="${lbl}" for="fDue">Fecha límite</label><input id="fDue" type="date" class="${inp}" value="${esc(d.due)}">
          <div class="flex gap-1.5 mt-1.5">${[['Hoy', 0], ['Mañana', 1], ['+1 sem', 7]].map(([l, n]) => `<button type="button" data-act="due" data-n="${n}" class="px-2.5 py-1 rounded-lg text-xs font-bold bg-slate-100 dark:bg-white/10 hover:bg-indigo-100 dark:hover:bg-indigo-500/20">${l}</button>`).join('')}<button type="button" data-act="due" data-n="x" class="px-2.5 py-1 rounded-lg text-xs font-bold text-slate-500 hover:bg-slate-100 dark:hover:bg-white/10">Quitar</button></div></div>

        <div id="notesList" class="mt-3 space-y-2 max-h-56 scroll-y">${notesHTML(d)}</div>
      </div>
    </div>
    <div class="flex items-center gap-2 px-5 py-3 border-t border-slate-200 dark:border-white/10" style="padding-bottom:calc(.75rem + env(safe-area-inset-bottom,0px))">
      ${modal.isNew ? '' : `<button data-act="delete" class="p-2.5 rounded-xl text-red-600 hover:bg-red-50 dark:hover:bg-red-500/10" aria-label="Eliminar tarea">${icon('trash', 'w-5 h-5')}</button>`}
      <button data-act="close-modal" class="ml-auto px-4 py-2.5 rounded-xl font-bold text-sm hover:bg-slate-100 dark:hover:bg-white/10">${modal.isNew ? 'Cancelar' : 'Cerrar'}</button>
      <button data-act="save-task" class="px-6 py-2.5 rounded-xl font-bold text-sm bg-indigo-600 hover:bg-indigo-500 text-white">${modal.isNew ? 'Crear tarea' : 'Listo'}</button>
    </div>
  </div>`;
  $('#modal').classList.remove('hidden');
  if (modal.isNew) setTimeout(() => { const f = $('#fTitle'); if (f) f.focus(); }, 30);
}
function readTaskForm() {
  const d = modal.draft;
  d.title = $('#fTitle').value.trim();
  d.catId = $('#fCat').value || null;
  d.subId = $('#fSub').value || null;
  d.priority = (document.querySelector('input[name=prio]:checked') || {}).value || 'med';
  const st = (document.querySelector('input[name=status]:checked') || {}).value || 'todo';
  if (st === 'done' && d.status !== 'done') d.completedAt = new Date().toISOString();
  if (st !== 'done') d.completedAt = null;
  d.status = st;
  d.due = $('#fDue').value || '';
  d.client = $('#fClient').value.trim();
}
function saveTask() {
  readTaskForm();
  const d = modal.draft;
  if (!d.title) { const f = $('#fTitle'); f.classList.add('border-red-500', 'ring-2', 'ring-red-300'); f.focus(); return; }
  const pending = $('#fNote').value.trim();
  if (pending) d.notes.push({ id: uid(), text: pending, ts: new Date().toISOString() });
  const i = state.tasks.findIndex(t => t.id === d.id);
  if (i >= 0) state.tasks[i] = d; else state.tasks.push(d);
  closeModal(); render(); toast(modal === null && i < 0 ? 'Tarea creada' : 'Cambios guardados');
}
function addNote() {
  const ta = $('#fNote'), text = ta.value.trim();
  if (!text) { ta.focus(); return; }
  readTaskForm();
  modal.draft.notes.push({ id: uid(), text, ts: new Date().toISOString() });
  // Si la tarea ya existe, la nota se guarda al instante
  const t = state.tasks.find(x => x.id === modal.draft.id);
  if (t) { t.notes = modal.draft.notes.slice(); save(); renderContent(); }
  ta.value = '';
  $('#notesList').innerHTML = notesHTML(modal.draft);
}
let autoT = null;
function autoRun() {
  autoT = null;
  if (!modal || modal.type !== 'task' || modal.isNew) return;
  readTaskForm();
  const d = modal.draft; if (!d.title) return;
  const i = state.tasks.findIndex(t => t.id === d.id); if (i < 0) return;
  state.tasks[i] = JSON.parse(JSON.stringify(d));
  save(); renderContent(); renderCtrl(); renderSidebar();
}
function autoSaveTask() {
  if (!modal || modal.type !== 'task' || modal.isNew) return;
  clearTimeout(autoT); autoT = setTimeout(autoRun, 350);
}
['input', 'change'].forEach(ev => document.addEventListener(ev, e => {
  if (modal && modal.type === 'task' && e.target.closest && e.target.closest('#modal') && e.target.id !== 'fNote') autoSaveTask();
}));
function closeModal() { if (autoT) { clearTimeout(autoT); autoRun(); } modal = null; const m = $('#modal'); m.classList.add('hidden'); m.innerHTML = ''; }

          <div class="flex items-center gap-2"><input data-new-sub="${c.id}" placeholder="Nueva subcategoría" class="${inp} flex-1 min-w-0"><button data-act="sub-add" data-id="${c.id}" class="px-3 py-2 rounded-lg text-xs font-bold bg-slate-100 dark:bg-white/10 hover:bg-indigo-100 dark:hover:bg-indigo-500/20">Añadir</button></div>
        </div></div>`).join('')}
      <div class="flex items-center gap-2"><input id="newCat" placeholder="Nueva categoría" class="${inp} flex-1 py-2.5"><button data-act="cat-add" class="px-4 py-2.5 rounded-xl text-sm font-bold bg-indigo-600 hover:bg-indigo-500 text-white">Crear</button></div>
      <p class="text-xs text-slate-500">Si eliminas una categoría, sus tareas se conservan en "Sin categoría".</p>
    </div>
    <div class="px-5 py-3 border-t border-slate-200 dark:border-white/10 flex justify-end" style="padding-bottom:calc(.75rem + env(safe-area-inset-bottom,0px))"><button data-act="close-modal" class="px-6 py-2.5 rounded-xl font-bold text-sm bg-indigo-600 hover:bg-indigo-500 text-white">Listo</button></div>
  </div>`;
  $('#modal').classList.remove('hidden');
}

/* ============ ACCIONES ============ */
function setStatus(id, st) {
  const t = state.tasks.find(x => x.id === id); if (!t || t.status === st) return;
  t.status = st; t.completedAt = st === 'done' ? new Date().toISOString() : null;
  render();
}
function quickAdd(text) {
  text = text.trim(); if (!text) return;
  let prio = 'med';
  if (text.startsWith('!')) { prio = 'high'; text = text.replace(/^!+\s*/, ''); }
  if (!text) return;
  const c = catOf(ui.cat);
  state.tasks.push({ id: uid(), title: text, catId: c ? c.id : null, subId: c && ui.sub ? ui.sub : null, priority: prio, due: ui.view === 'hoy' ? todayStr() : '', client: '', status: 'todo', notes: [], createdAt: new Date().toISOString(), completedAt: null });
  render(); toast('Tarea anotada');
}
function closeDrawer() { $('#sidebar').classList.add('-translate-x-full'); $('#overlay').classList.add('hidden'); }
function setTheme(t) {
  document.documentElement.classList.toggle('dark', t === 'dark');
  try { localStorage.setItem('bicigestor_theme', t); } catch (e) {}
  $('#btnTheme').innerHTML = icon(t === 'dark' ? 'sun' : 'moon', 'w-5 h-5');
}
function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'bicigestor-' + todayStr() + '.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ============ EVENTOS ============ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  // Evitar que el clic en botones internos de la tarjeta abra el modal
  if (['toggle', 'advance'].includes(act)) e.stopPropagation();
  switch (act) {
    case 'open': openTask(id); break;
    case 'new': openTask(null, { status: el.dataset.st }); break;
    case 'toggle': { const t = state.tasks.find(x => x.id === id); if (t) setStatus(id, t.status === 'done' ? 'todo' : 'done'); break; }
    case 'advance': { const t = state.tasks.find(x => x.id === id); if (t) setStatus(id, t.status === 'todo' ? 'doing' : 'done'); break; }
    case 'cat': ui.cat = id || null; ui.sub = null; render(); if (!id) closeDrawer(); else { /* mantener cajón para elegir sub */ if (!(catOf(id) || {subs: []}).subs.length) closeDrawer(); } break;
    case 'sub': ui.sub = ui.sub === id ? null : id; render(); closeDrawer(); break;
    case 'view': ui.view = id; renderMain(); break;
    case 'range': ui.range = id; renderContent(); break;
    case 'clear': ui.prio = ui.due = ui.status = ui.q = ''; $('#search').value = $('#searchM').value = ''; renderMain(); break;
    case 'm-urgent': ui.view = 'lista'; ui.due = 'urgent'; ui.status = ''; ui.prio = ''; renderMain(); break;
    case 'm-open': ui.view = 'kanban'; ui.due = ''; ui.status = ''; renderMain(); break;
    case 'm-done': ui.view = 'lista'; ui.status = 'done'; ui.due = ''; renderMain(); break;
    case 'open-drawer': $('#sidebar').classList.remove('-translate-x-full'); $('#overlay').classList.remove('hidden'); break;
    case 'close-drawer': closeDrawer(); break;
    case 'theme': setTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark'); break;
    case 'cats': closeDrawer(); openCats(); break;
    case 'export': exportData(); break;
    case 'import': $('#fileImport').click(); break;
    case 'close-modal': closeModal(); break;
    case 'save-task': saveTask(); break;
    case 'add-note': addNote(); break;
    case 'due': { const n = el.dataset.n; $('#fDue').value = n === 'x' ? '' : addDays(parseInt(n, 10)); break; }
    case 'delete': {
      const snap = snapshot();
      state.tasks = state.tasks.filter(t => t.id !== modal.draft.id);
      closeModal(); render(); toast('Tarea eliminada', snap); break;
    }
    case 'undo': { const snap = $('#toast')._snap; if (snap) { state = JSON.parse(snap); $('#toast').classList.add('hidden'); render(); if (modal && modal.type === 'cats') drawCatsModal(); } break; }
    /* categorías */
    case 'cat-color': { const c = catOf(id); c.color = PALETTE[(PALETTE.indexOf(c.color) + 1) % PALETTE.length]; save(); drawCatsModal(); renderMain(); break; }
    case 'cat-del': {
      const snap = snapshot();
      state.tasks.forEach(t => { if (t.catId === id) { t.catId = null; t.subId = null; } });
      state.cats = state.cats.filter(c => c.id !== id);
      if (ui.cat === id) { ui.cat = null; ui.sub = null; }
      drawCatsModal(); render(); toast('Categoría eliminada', snap); break;
    }
    case 'cat-add': {
      const inp = $('#newCat'), name = inp.value.trim(); if (!name) { inp.focus(); break; }
      state.cats.push({ id: uid(), name, color: PALETTE[state.cats.length % PALETTE.length], subs: [] });
      drawCatsModal(); render(); setTimeout(() => { const f = $('#newCat'); if (f) f.focus(); }, 20); break;
    }
    case 'sub-add': {
      const inp = document.querySelector(`[data-new-sub="${id}"]`), name = inp.value.trim(); if (!name) { inp.focus(); break; }
      catOf(id).subs.push({ id: uid(), name }); drawCatsModal(); render();
      setTimeout(() => { const f = document.querySelector(`[data-new-sub="${id}"]`); if (f) f.focus(); }, 20); break;
    }
    case 'sub-del': {
      const snap = snapshot(), c = catOf(el.dataset.cat);
      c.subs = c.subs.filter(s => s.id !== id);
      state.tasks.forEach(t => { if (t.subId === id) t.subId = null; });
      if (ui.sub === id) ui.sub = null;
      drawCatsModal(); render(); toast('Subcategoría eliminada', snap); break;
    }
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'fltPrio') { ui.prio = t.value; renderMain(); }
  else if (t.id === 'fltDue') { ui.due = t.value; renderMain(); }
  else if (t.id === 'fltStatus') { ui.status = t.value; renderMain(); }
  else if (t.id === 'fCat' && modal) { $('#fSub').innerHTML = subOptions(t.value, null); }
  else if (t.dataset && t.dataset.renameCat) { const c = catOf(t.dataset.renameCat); if (c && t.value.trim()) { c.name = t.value.trim(); render(); } else if (c) t.value = c.name; }
  else if (t.dataset && t.dataset.renameSub) { const c = catOf(t.dataset.cat), s = c && c.subs.find(x => x.id === t.dataset.renameSub); if (s && t.value.trim()) { s.name = t.value.trim(); render(); } else if (s) t.value = s.name; }
  else if (t.id === 'fileImport') {
    const f = t.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const s = JSON.parse(r.result);
        if (!s.cats || !s.tasks) throw new Error('formato');
        const snap = snapshot(); state = s; ui.cat = ui.sub = null; render(); toast('Copia restaurada', snap);
      } catch (err) { toast('Archivo no válido'); }
      t.value = '';
    };
    r.readAsText(f);
  }
});

// Buscadores (no re-renderizan la cabecera para no perder el foco)
['#search', '#searchM'].forEach(sel => $(sel).addEventListener('input', e => {
  ui.q = e.target.value.trim();
  $('#search').value = $('#searchM').value = e.target.value;
  renderContent();
  // actualizar el botón "Limpiar filtros" sin tocar los inputs de búsqueda
  renderCtrl();
}));

$('#quick').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.isComposing) { quickAdd(e.target.value); e.target.value = ''; }
});

document.addEventListener('keydown', e => {
  const tag = (document.activeElement || {}).tagName;
  const typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(tag);
  if (e.key === 'Escape') { if (modal) closeModal(); else closeDrawer(); }
  else if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && modal && modal.type === 'task') saveTask();
  else if (e.key === 'Enter' && !typing === false && tag === 'INPUT' && modal && modal.type === 'cats') {
    const a = document.activeElement;
    if (a.id === 'newCat') document.querySelector('[data-act=cat-add]').click();
    else if (a.dataset.newSub) document.querySelector(`[data-act=sub-add][data-id="${a.dataset.newSub}"]`).click();
    else a.blur();
  }
  else if (e.key === 'Enter' && modal && modal.type === 'task' && document.activeElement.id === 'fTitle') saveTask();
  else if (!typing && !modal && (e.key === 'n' || e.key === 'N') && !e.ctrlKey && !e.metaKey) { e.preventDefault(); openTask(null); }
  else if (!typing && !modal && e.key === '/') { e.preventDefault(); ($('#search').offsetParent ? $('#search') : $('#searchM')).focus(); }
});

/* Arrastrar y soltar (escritorio/tablet) */
let dragId = null;
document.addEventListener('dragstart', e => { const c = e.target.closest && e.target.closest('.task'); if (!c) return; dragId = c.dataset.id; c.classList.add('dragging'); try { e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.effectAllowed = 'move'; } catch (x) {} });
document.addEventListener('dragend', () => { dragId = null; document.querySelectorAll('.dragging').forEach(x => x.classList.remove('dragging')); document.querySelectorAll('.col-over').forEach(x => x.classList.remove('col-over')); });
document.addEventListener('dragover', e => { const col = e.target.closest && e.target.closest('[data-col]'); if (!col || !dragId) return; e.preventDefault(); document.querySelectorAll('.col-over').forEach(x => x !== col && x.classList.remove('col-over')); col.classList.add('col-over'); });
document.addEventListener('drop', e => { const col = e.target.closest && e.target.closest('[data-col]'); if (!col || !dragId) return; e.preventDefault(); const id = dragId; dragId = null; setStatus(id, col.dataset.col); });

/* ============ INICIO ============ */
$('#btnMenu').innerHTML = icon('menu', 'w-6 h-6');
$('#icoSearch').innerHTML = icon('search');
$('#icoQuick').innerHTML = icon('plus', 'w-5 h-5');
$('#fab').innerHTML = icon('plus', 'w-5 h-5') + '<span>Nueva tarea</span>';
setTheme(document.documentElement.classList.contains('dark') ? 'dark' : 'light');
(async function init() {
  if (!hadLS) {
    try { const raw = await IDB.get(KEY); if (raw) { const s = JSON.parse(raw); if (s && s.cats && s.tasks) state = s; } } catch (e) {}
  }
  render();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
})();
window.addEventListener('pagehide', () => { if (autoT) { clearTimeout(autoT); autoRun(); } save(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { if (autoT) { clearTimeout(autoT); autoRun(); } save(); } });
// Refrescar alertas de vencimiento al volver a la pestaña o al cambiar el día
let lastDay = todayStr();
const refreshDay = () => { if (todayStr() !== lastDay) { lastDay = todayStr(); render(); } };
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshDay(); });
setInterval(refreshDay, 60000);
</script>
</body>
</html>
